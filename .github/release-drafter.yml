# Categories/labels below match this repo's actual label set (see
# `gh label list`) - the previous version was an unmodified template
# copy-paste referencing feat/fix/docs/chore/dependencies/breaking/
# security, none of which exist here, so every PR would have fallen into
# "uncategorized" regardless of how it was labeled.
name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
change-template: '- $TITLE (#$NUMBER)'
categories:
  - title: "🚀 Enhancements"
    labels:
      - enhancement
  - title: "🐛 Fixes"
    labels:
      - bug
  - title: "📝 Docs"
    labels:
      - documentation
version-resolver:
  minor:
    labels:
      - enhancement
  patch:
    labels:
      - bug
      - documentation
  default: patch
template: |
  ## Changes
  $CHANGES
